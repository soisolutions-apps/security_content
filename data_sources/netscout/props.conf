### DNS Specific mappings
FIELDALIAS-answer = resolved_ip_address AS answer
FIELDALIAS-query = domain AS query
FIELDALIAS-query_type = query_type AS record_type
FIELDALIAS-name = message AS name
EVAL-answer_count = mvcount(split(resolved_ip_address,"|"))
EVAL-reply_code_id = response_code
EVAL-reply_code = if(response_code=0,"NoError", replace(response_description,"\s",""))
EVAL-message_type = "QUERY"


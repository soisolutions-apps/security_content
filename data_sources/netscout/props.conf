FIELDALIAS-dvc_ip = ai_sensor_ip_address AS dvc_ip
FIELDALIAS-src = client_host AS src
FIELDALIAS-src_port = client_port AS src_port
EVAL-duration = round(strptime(transaction_end_time, "%Y-%m-%d %H:%M:%S.%N %Z")-strptime(transaction_start_time, "%Y-%m-%d %H:%M:%S.%N %Z"),2)

## HTTP specific mappings to Web Datamodels
FIELDALIAS-app = application_name AS category
FIELDALIAS-bytes_in = http_server_to_client_octets AS bytes_in
FIELDALIAS-bytes_out = http_client_to_server_octets AS bytes_out
FIELDALIAS-packets_in = http_server_to_client_packets AS packets_in
FIELDALIAS-packets_out = http_client_to_server_packets AS packets_out
FIELDALIAS-status = response_code AS status
FIELDALIAS-user_gent = user_agent AS http_user_agent
FIELDALIAS-uri_path = target_uri AS uri_path
FIELDALIAS-url_domain = request_host_name AS url_domain
FIELDALIAS-http_referrer = refferer AS http_referrer
FIELDALIAS-uri_query = uri_query_values
EVAL-action = "allowed"
EVAL-bytes = bytes_in + bytes_out
EVAL-packets = packets_in + packets_out
EVAL-http_method = if(match(message_name, "_HTTP"), upper(replace(message_name,"_HTTP","")), upper(message_name))
EVAL-http_user_agent_length = len(http_user_agent)
EVAL-transport = lower(packet_type_name)
EVAL-url_length = len(coalesce("http://"+request_host_name+"/"+target_uri+"?"+uri_query_values, "http://"+request_host_name+"/"+target_uri, "http://"+request_host_name))
EVAL-url = coalesce("http://"+request_host_name+"/"+target_uri+"?"+uri_query_values, "http://"+request_host_name+"/"+target_uri, "http://"+request_host_name)
EVAL-response_time = (http_response_time_usec/1000000)


[netscout:omnis:flow:base]
TIME_FORMAT = %Y-%m-%d %H:%M:%S.%6Q %Z
TIME_PREFIX = ^\"\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}\.\d+ \S+\",\"
SHOULD_LINEMERGE = false
category = Network & Security
description = Netscout Systems Network Security Appliance
pulldown_type = 1
LINE_BREAKER = ([\r\n]+)
TRANSFORMS-header_drop = header_drop
REPORT-base-header = netscout_base_header

FIELDALIAS-dest = server_ip_address AS dest
FIELDALIAS-dest_port = server_port AS dest_port
FIELDALIAS-src = client_ip_address AS src
FIELDALIAS-src_port = client_port AS src_port
FIELDALIAS-dvc = ai_sensor_name AS dvc
EVAL-transport = lower(packet_type_name)
EVAL-action = case(flow_end_reason_name=="End of flow detected","teardown",flow_end_reason_name=="Lack of resources","teardown",flow_end_reason_name=="Idle timeout","teardown",flow_end_reason_name=="Active","allowed", 1=1, "allowed")
FIELDALIAS-bytes_in = server_to_client_octets AS bytes_in
FIELDALIAS-bytes_out = client_to_server_octets AS bytes_out
FIELDALIAS-packets_in = server_to_client_packets AS packets_in
FIELDALIAS-packets_out = client_to_server_packets AS packets_out
FIELDALIAS-vlan = vlan_id AS vlan
EVAL-bytes = bytes_in + bytes_out
EVAL-packets = packets_in + packets_out
FIELDALIAS-app = application_name AS app
EVAL-duration = round(strptime(flow_end_time, "%Y-%m-%d %H:%M:%S.%N %Z")-strptime(flow_start_time, "%Y-%m-%d %H:%M:%S.%N %Z"),2)

#specific Network Traffic fields
FIELDALIAS-rule = flow_end_reason_name AS rule
EVAL-vendor_product = "NetScout Systems, Inc."
FIELDALIAS-src_ip = client_ip_address AS src_ip
FIELDALIAS-dest_ip = server_ip_address AS dest_ip



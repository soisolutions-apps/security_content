FIELDALIAS-app = application_name AS app
FIELDALIAS-dest = server_host AS dest
FIELDALIAS-dvc = ai_sensor_name AS dvc
FIELDALIAS-dvc_ip = ai_sensor_ip_address AS dvc_ip
